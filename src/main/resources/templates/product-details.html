<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Product details')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('products')}"></header>

<main class="container narrow">
    <div class="page-header">
        <h1 th:text="${product.name}">Product</h1>
        <a th:href="@{/products}" class="btn btn-outline">&larr; Back to list</a>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <section class="card pad">
        <dl class="details">
            <dt>Category</dt>
            <dd th:text="${product.category}">Category</dd>

            <dt>Price</dt>
            <dd>&#8377; <span th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">0.00</span></dd>

            <dt>Stock</dt>
            <dd>
                <span class="badge" th:text="${product.stock}"
                      th:classappend="${product.stock == 0} ? 'badge-danger' : (${product.stock lt 10} ? 'badge-warn' : 'badge-ok')">0</span>
            </dd>

            <dt>Rating</dt>
            <dd>&#9733; <span th:text="${#numbers.formatDecimal(product.rating, 1, 1)}">0.0</span> / 5</dd>

            <dt>Description</dt>
            <dd th:text="${product.description != null} ? ${product.description} : 'No description provided.'">Description</dd>

            <dt>Created</dt>
            <dd th:text="${#temporals.format(product.createdAt, 'dd MMM yyyy, HH:mm')}">date</dd>

            <dt>Last updated</dt>
            <dd th:text="${#temporals.format(product.updatedAt, 'dd MMM yyyy, HH:mm')}">date</dd>
        </dl>

        <div class="form-actions" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/products/{id}/edit(id=${product.id})}" class="btn btn-primary">Edit</a>
            <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" class="inline-form"
                  data-confirm="Are you sure you want to delete this product?">
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
