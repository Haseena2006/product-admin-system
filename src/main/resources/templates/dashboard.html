<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('dashboard')}"></header>

<main class="container">
    <div class="page-header">
        <h1>Dashboard</h1>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/products/new}" class="btn btn-primary">+ Add Product</a>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <section class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">Total products</span>
            <span class="stat-value" th:text="${stats.totalProducts}">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Categories</span>
            <span class="stat-value" th:text="${stats.totalCategories}">0</span>
        </div>
        <div class="stat-card warn">
            <span class="stat-label">Low stock (&lt; 10)</span>
            <span class="stat-value" th:text="${stats.lowStockCount}">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Inventory value</span>
            <span class="stat-value">&#8377; <span th:text="${#numbers.formatDecimal(stats.inventoryValue, 1, 'COMMA', 2, 'POINT')}">0.00</span></span>
        </div>
    </section>

    <section class="card">
        <div class="card-header">
            <h2>Recently added</h2>
            <a th:href="@{/products}" class="link">View all products &rarr;</a>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Name</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${stats.recentProducts}">
                    <td><a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}">Name</a></td>
                    <td th:text="${p.category}">Category</td>
                    <td class="num">&#8377; <span th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}">0.00</span></td>
                    <td class="num" th:text="${p.stock}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(stats.recentProducts)}">
                    <td colspan="4" class="empty">No products yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
