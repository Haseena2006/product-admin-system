<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="auth-page">
<main class="auth-card center">
    <h1 th:text="${status}">500</h1>
    <p class="lead" th:text="${error}">Something went wrong</p>
    <p class="muted" th:if="${message}" th:text="${message}"></p>
    <a th:href="@{/dashboard}" class="btn btn-primary">Back to dashboard</a>
</main>
</body>
</html>
